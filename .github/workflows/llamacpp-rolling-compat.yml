name: llama.cpp Rolling Compatibility

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: llama.cpp ref to probe
        required: false
        default: HEAD
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  rolling-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3-venv libomp-dev
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -c .github/requirements-nightly-constraints.txt -r version/v8/requirements.txt

      - name: Fetch pinned callback fixture
        run: |
          model=$(.venv/bin/python - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(
              repo_id="Qwen/Qwen3-0.6B-GGUF",
              filename="Qwen3-0.6B-Q8_0.gguf",
              revision="23749fefcc72300e3a2ad315e1317431b06b590a",
          ))
          PY
          )
          printf '%s  %s\n' 9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031 "$model" | sha256sum -c -
          echo "CK_LLAMA_ROLLING_CAPTURE_MODEL=$model" >> "$GITHUB_ENV"

      - name: Probe rolling llama.cpp
        id: probe
        continue-on-error: true
        env:
          LLAMA_REF: ${{ inputs.llama_ref || 'HEAD' }}
        run: |
          .venv/bin/python scripts/run_llamacpp_rolling_compat.py \
            --ref "$LLAMA_REF" \
            --output-dir build/llamacpp_rolling

      - name: Publish report summary
        if: always()
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("build/llamacpp_rolling/report.json")
          if not path.exists():
              print("## llama.cpp rolling compatibility\n\nNo report was produced.", file=open(os.environ["GITHUB_STEP_SUMMARY"], "a"))
              raise SystemExit(0)
          data = json.loads(path.read_text())
          llama = data["llama_cpp"]
          patch_phase = data.get("phases", {}).get("patch_compatibility", {})
          patch_status = patch_phase.get("status", "unknown").upper()
          lines = [
              "## llama.cpp rolling compatibility",
              "",
              f"- Status: **{data['status'].upper()}**",
              f"- CK: `{data['cke_commit'][:12]}`",
              f"- Pinned oracle: `{llama['pinned_commit'][:12]}`",
              f"- Rolling upstream: `{llama['rolling_commit'][:12]}`",
              f"- Upstream commits since pin: {llama.get('commits_ahead_of_pin', 'unknown')}",
              f"- Optional patch drift: **{patch_status}** (non-blocking)",
              "- Authoritative oracle changed: **no**",
          ]
          for patch in patch_phase.get("patches", []):
              lines.append(f"  - `{patch['path']}`: {patch['status']}")
          for name in ("ck_build", "quick_parity", "production_graph_parity", "mtmd_adapter_build", "xray_callback"):
              phase = data.get("phases", {}).get(name, {})
              lines.append(f"- {name}: **{phase.get('status', 'not_tested').upper()}**")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Upload rolling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llamacpp-rolling-compat
          path: |
            build/llamacpp_rolling/report.json
            build/llamacpp_rolling/ck-build.log
            build/llamacpp_rolling/quick-parity.log
            build/llamacpp_rolling/production-graph-parity.log
            build/llamacpp_rolling/mtmd-adapter.log
            build/llamacpp_rolling/xray-callback.log
            build/llamacpp_rolling/xray-callback/report.json
          if-no-files-found: warn

      - name: Enforce rolling compatibility result
        if: always()
        run: |
          test -f build/llamacpp_rolling/report.json
          test "$(.venv/bin/python -c 'import json; print(json.load(open("build/llamacpp_rolling/report.json"))["status"])')" = pass
