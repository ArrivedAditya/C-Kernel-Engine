jobs:
  numerical:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical test dependencies
        run: python3 -m pip install numpy jsonschema
      - name: Verify registered kernel-map numerical and composition cases
        env:
          CKE_KOKORO_LAYER_EVIDENCE_DIR: ${{ github.workspace }}/build/kernel-oracle-captures/kokoro-first-layer
          CKE_KOKORO_ENCODER_EVIDENCE_DIR: ${{ github.workspace }}/build/kernel-oracle-captures/kokoro-encoder
        run: |
          python3 scripts/nightly_runner.py --kernel-map-tests \
            version/v8/kernel_maps/embedding_three_table_layer_norm_f32.json \
            version/v8/kernel_maps/linear_rows_checked_f32.json \
            version/v8/kernel_maps/attention_full_token_major_f32_checked.json \
            version/v8/kernel_maps/layernorm_rows_checked_f32.json \
            version/v8/kernel_maps/gelu_rows_tanh_checked_f32.json \
            version/v8/kernel_maps/audio_duration_expand_channel_major_f32.json \
            version/v8/kernel_maps/audio_duration_logits_to_frames_f32.json \
            version/v8/kernel_maps/audio_istft_mag_phase_f32.json \
            version/v8/kernel_maps/audio_lstm_bidirectional_scan_f32.json \
            version/v8/kernel_maps/audio_adaptive_layer_norm_f32.json \
            --json build/kernel-map-pr-report.json
      - name: Verify generic compiler and oracle reporting contracts
        if: always()
        run: |
          python3 -m unittest \
            tests.test_v8_runtime_extent_kernel \
            tests.test_v8_runtime_extent_contract \
            tests.test_v8_checked_call_codegen \
            tests.test_v8_runtime_extent_lowering \
            tests.test_v8_checked_static_entry \
            tests.test_v8_kokoro_generated_embedding \
            tests.test_v8_kokoro_generated_projection \
            tests.test_v8_checked_op_constants \
            tests.test_v8_kokoro_generated_qkv \
            tests.test_v8_attention_full_token_major_generated \
            tests.test_v8_kokoro_generated_attention_context \
            tests.test_v8_duration_logits_runtime_graph \
            tests.test_v8_duration_two_stream_runtime_graph \
            tests.test_kernel_oracle_reporting
      - name: Upload existing-format kernel numerical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-map-pr-report
          path: |
            build/kernel-map-pr-report.json
            build/kernel-oracle-captures/**
          if-no-files-found: error
      - name: Verify Kokoro import envelope and rejection contracts
        run: python3 -m unittest tests.test_v8_kokoro_bump_export
      - name: Verify generated graph X-Ray capture against independent oracle
        run: |
          python3 -m unittest \
            tests.test_v8_xray_numerical_parity.XRayNumericalParityTests.test_runtime_valid_extent_ignores_padded_physical_columns \
            tests.test_v8_xray_numerical_parity.XRayNumericalParityTests.test_builder_preserves_runtime_capture_geometry \
            tests.test_v8_xray_numerical_parity.XRayNumericalParityTests.test_generated_duration_graph_matches_independent_oracle_capture
      - name: Verify pinned Kokoro predictor checkpoint coverage
        run: python3 -m unittest tests.test_v8_kokoro_checkpoint_manifest
