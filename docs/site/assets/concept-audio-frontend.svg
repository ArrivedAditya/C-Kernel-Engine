<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="afe-title afe-desc">
  <title id="afe-title">Audio frontend kernel dataflow</title>
  <desc id="afe-desc">How a PCM16 WAV becomes Whisper encoder tokens: WAV decode to mono f32, band-limited resample, STFT power spectrum, 80-bin log-Mel, two-layer Conv1D stem with GELU, and a channel-to-token transpose with learned positional embedding. Every stage is a named C kernel.</desc>
  <defs>
    <linearGradient id="afe-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#17243a"/>
    </linearGradient>
    <linearGradient id="afe-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13233c"/>
      <stop offset="1" stop-color="#0d1a2e"/>
    </linearGradient>
    <linearGradient id="afe-hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="afe-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="afe-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="afe-arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1100" height="660" fill="url(#afe-bg)"/>
  <g opacity="0.25" stroke="#26364f" stroke-width="1">
    <path d="M0 110H1100M0 220H1100M0 330H1100M0 440H1100M0 550H1100"/>
    <path d="M100 0V660M300 0V660M500 0V660M700 0V660M900 0V660"/>
  </g>

  <text x="40" y="42" font-size="12" letter-spacing="3" fill="#7dd3fc" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">AUDIO FRONTEND &#183; CONCRETE KERNELS, NOT HIDDEN PREPROCESSING</text>
  <text x="40" y="80" font-size="30" font-weight="700" fill="#f1f5f9" font-family="'Inter',system-ui,sans-serif">Waveform to Encoder Tokens</text>
  <text x="40" y="106" font-size="13.5" fill="#94a3b8" font-family="'Inter',system-ui,sans-serif">The Whisper Tiny frontend as six named kernels in src/kernels/audio_kernels.c &#8212; each one parity-checked against PyTorch.</text>

  <!-- Row 1 -->
  <g filter="url(#afe-shadow)">
    <rect x="40" y="140" width="300" height="152" rx="12" fill="url(#afe-node)" stroke="#2b3f5f"/>
    <rect x="40" y="140" width="300" height="34" rx="12" fill="#0ea5e9" opacity="0.16"/>
    <text x="56" y="162" font-size="12" letter-spacing="2" fill="#7dd3fc" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">1 &#183; WAV DECODE</text>
    <text x="56" y="198" font-size="13" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">audio_wav_decode_pcm16</text>
    <text x="56" y="216" font-size="13" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">_mono_f32</text>
    <text x="56" y="242" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">RIFF parse &#8594; int16 &#8594; f32</text>
    <text x="56" y="262" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">s[n] = pcm16[n] / 32768</text>
    <text x="56" y="282" font-size="12" fill="#64748b" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">[n_samples]</text>
  </g>

  <line x1="340" y1="216" x2="392" y2="216" stroke="#7dd3fc" stroke-width="2" marker-end="url(#afe-arrow)"/>

  <g filter="url(#afe-shadow)">
    <rect x="400" y="140" width="300" height="152" rx="12" fill="url(#afe-node)" stroke="#2b3f5f"/>
    <rect x="400" y="140" width="300" height="34" rx="12" fill="#0ea5e9" opacity="0.16"/>
    <text x="416" y="162" font-size="12" letter-spacing="2" fill="#7dd3fc" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">2 &#183; RESAMPLE</text>
    <text x="416" y="198" font-size="13" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">audio_resample_windowed</text>
    <text x="416" y="216" font-size="13" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">_sinc_f32</text>
    <text x="416" y="242" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">band-limited sinc interpolation</text>
    <text x="416" y="262" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">(linear variant for the fast path)</text>
    <text x="416" y="282" font-size="12" fill="#64748b" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">any rate &#8594; 16 kHz mono</text>
  </g>

  <line x1="700" y1="216" x2="752" y2="216" stroke="#7dd3fc" stroke-width="2" marker-end="url(#afe-arrow)"/>

  <g filter="url(#afe-shadow)">
    <rect x="760" y="140" width="300" height="152" rx="12" fill="url(#afe-node)" stroke="#2b3f5f"/>
    <rect x="760" y="140" width="300" height="34" rx="12" fill="#0ea5e9" opacity="0.16"/>
    <text x="776" y="162" font-size="12" letter-spacing="2" fill="#7dd3fc" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">3 &#183; STFT POWER</text>
    <text x="776" y="198" font-size="13" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">audio_stft_power_fft400_f32</text>
    <text x="776" y="222" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">n_fft = 400 &#183; hop = 160 &#183; Hann window</text>
    <text x="776" y="242" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">precomputed trig tables + 20&#215;20 FFT</text>
    <text x="776" y="262" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">|X[t, f]|&#178; magnitude squared</text>
    <text x="776" y="282" font-size="12" fill="#64748b" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">[201 bins &#215; T frames]</text>
  </g>

  <!-- connector row1 -> row2 -->
  <path d="M 910 292 L 910 322 L 190 322 L 190 356" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#afe-arrow-amber)" stroke-dasharray="6 4"/>

  <!-- Row 2 -->
  <g filter="url(#afe-shadow)">
    <rect x="40" y="360" width="300" height="152" rx="12" fill="url(#afe-node)" stroke="#2b3f5f"/>
    <rect x="40" y="360" width="300" height="34" rx="12" fill="#f59e0b" opacity="0.14"/>
    <text x="56" y="382" font-size="12" letter-spacing="2" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">4 &#183; LOG-MEL</text>
    <text x="56" y="418" font-size="13" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">audio_whisper_log_mel_from</text>
    <text x="56" y="436" font-size="13" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">_power_reference_f32</text>
    <text x="56" y="462" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">80-bin mel filterbank over power</text>
    <text x="56" y="482" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">log10 &#183; clamp to max &#8722; 8 &#183; rescale</text>
    <text x="56" y="502" font-size="12" fill="#64748b" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">[80 mels &#215; 3000 frames]</text>
  </g>

  <line x1="340" y1="436" x2="392" y2="436" stroke="#7dd3fc" stroke-width="2" marker-end="url(#afe-arrow)"/>

  <g filter="url(#afe-shadow)">
    <rect x="400" y="360" width="300" height="152" rx="12" fill="url(#afe-node)" stroke="#2b3f5f"/>
    <rect x="400" y="360" width="300" height="34" rx="12" fill="#f59e0b" opacity="0.14"/>
    <text x="416" y="382" font-size="12" letter-spacing="2" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">5 &#183; CONV STEM + GELU</text>
    <text x="416" y="418" font-size="13" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">audio_conv1d_channel_major_f32</text>
    <text x="416" y="442" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">conv1: 80 &#8594; 384, k=3, s=1, p=1 + GELU</text>
    <text x="416" y="462" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">conv2: 384 &#8594; 384, k=3, s=2, p=1 + GELU</text>
    <text x="416" y="482" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">stride-2 halves the time axis</text>
    <text x="416" y="502" font-size="12" fill="#64748b" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">[384 ch &#215; 1500 frames]</text>
  </g>

  <line x1="700" y1="436" x2="752" y2="436" stroke="#7dd3fc" stroke-width="2" marker-end="url(#afe-arrow)"/>

  <g filter="url(#afe-shadow)">
    <rect x="760" y="360" width="300" height="152" rx="12" fill="url(#afe-node)" stroke="#2b3f5f"/>
    <rect x="760" y="360" width="300" height="34" rx="12" fill="#10b981" opacity="0.16"/>
    <text x="776" y="382" font-size="12" letter-spacing="2" fill="#34d399" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">6 &#183; TOKEN LAYOUT</text>
    <text x="776" y="418" font-size="13" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">audio_transpose_channel_to</text>
    <text x="776" y="436" font-size="13" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">_token_f32</text>
    <text x="776" y="462" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">channel-major &#8594; token-major</text>
    <text x="776" y="482" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">+ learned positional embedding</text>
    <text x="776" y="502" font-size="12" fill="#64748b" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">[1500 tokens &#215; 384] &#8594; encoder</text>
  </g>

  <!-- Math band -->
  <g filter="url(#afe-shadow)">
    <rect x="40" y="540" width="1020" height="92" rx="12" fill="#0b1729" stroke="#2b3f5f"/>
    <text x="64" y="568" font-size="12" letter-spacing="2" fill="#7dd3fc" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">THE MATH EACH KERNEL CARRIES</text>
    <text x="64" y="598" font-size="13.5" fill="#e2e8f0" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">P[t,f] = | &#931;_n s[t&#183;160+n] &#183; w_hann[n] &#183; e^(&#8722;2&#960;i f n / 400) |&#178;</text>
    <text x="64" y="620" font-size="13.5" fill="#e2e8f0" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">L = ( clamp(log10(M_mel &#183; P), &#8805; max &#8722; 8) + 4 ) / 4</text>
    <text x="620" y="598" font-size="13.5" fill="#e2e8f0" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">y[o,t] = b[o] + &#931;_i &#931;_k w[o,i,k] &#183; x[i, t&#183;s + k &#8722; p]</text>
    <text x="620" y="620" font-size="12" fill="#64748b" font-family="'Inter',system-ui,sans-serif">GELU(x) = x &#183; &#934;(x) &#8212; erf form, matching the PyTorch oracle</text>
  </g>
</svg>
